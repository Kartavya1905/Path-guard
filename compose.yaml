name: pathguard

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pathguard
      POSTGRES_PASSWORD: pathguard # local-only demo credential
      POSTGRES_DB: pathguard
    ports:
      - "127.0.0.1:26432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathguard -d pathguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      PATHGUARD_ENV: local
      PATHGUARD_DATABASE_URL: postgresql+psycopg://pathguard:pathguard@db:5432/pathguard
      PATHGUARD_DEMO_IDENTITY_ENABLED: "true"
      PATHGUARD_EXTERNAL_PROCESSING_ENABLED: "false"
      # Optional AI suggestions: off unless you set PATHGUARD_AI_ENABLED=true before
      # `docker compose up`. Uses the free local Ollama on this computer.
      PATHGUARD_AI_ENABLED: ${PATHGUARD_AI_ENABLED:-false}
      PATHGUARD_AI_BASE_URL: http://host.docker.internal:11434
      PATHGUARD_AI_MODEL: ${PATHGUARD_AI_MODEL:-qwen2.5:1.5b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8600:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:3600:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
